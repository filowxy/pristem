<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>pristem</title>
    <!-- Painted before any module resolves: no white flash, no blank window.
         The dial is the product's presence indicator, so the first frame is
         already the product rather than a generic spinner. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0F0F0F; }
      #boot {
        position: fixed; inset: 0; z-index: 999; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse 60% 52% at 50% 42%, #1D1D1D 0%, #141414 58%, #0F0F0F 100%);
        transition: opacity 240ms cubic-bezier(.22,.8,.2,1);
      }
      #boot::before {
        content: ''; position: absolute; top: 36px; left: 0; right: 0;
        height: 1px; background: #282828;
      }
      .boot-dial { display: flex; gap: 3px; height: 12px; align-items: stretch; }
      .boot-dial i {
        display: block; width: 4px; height: 100%; border-radius: 1px;
        background: #282828;
        animation: boot-fill 1.1s cubic-bezier(.22,.8,.2,1) both;
      }
      .boot-dial i:nth-child(1) { animation-delay: 0ms; }
      .boot-dial i:nth-child(2) { animation-delay: 80ms; }
      .boot-dial i:nth-child(3) { animation-delay: 160ms; }
      .boot-dial i:nth-child(4) { animation-delay: 240ms; }
      .boot-dial i:nth-child(5) { animation-delay: 320ms; }
      @keyframes boot-fill { from { background: #282828; opacity: .4; } to { background: #E8E8E8; opacity: 1; } }
      #boot.boot-done { opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        .boot-dial i { animation: none; background: #A2A2A2; opacity: .8; }
        #boot { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span class="boot-dial"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
